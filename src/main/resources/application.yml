server:
  port: ${PORT:3000}
  forward-headers-strategy: framework
  servlet:
    context-path: /api        # => http://localhost:3000/api/...

spring:
  application:
    name: hotelnt-backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Liquibase quan ly schema; Hibernate chi kiem tra mapping
      naming:
        # Giu nguyen ten cot camelCase (maCSLT, tenCSLT...) - khong doi sang snake_case
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_batch_fetch_size: 50     # tai collection lazy theo lo, tranh N+1 khi liet ke
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

app:
  cors-origins: ${CORS_ORIGINS:*}
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  auth:
    mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
  google:
    maps-api-key: ${GOOGLE_MAPS_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
