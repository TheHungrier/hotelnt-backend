server:
  port: ${PORT:3000}
  servlet:
    context-path: /api        # => http://localhost:3000/api/...

spring:
  application:
    name: hotelnt-backend
  # TAM THOI tat tu cau hinh DB de chay duoc khi chua co SQL Server (dang tra du lieu mau).
  # Khi nhom da co DB: XOA khoi "autoconfigure.exclude" 2 dong ben duoi va bo comment phan datasource.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  # datasource:
  #   url: jdbc:sqlserver://localhost:1433;databaseName=HotelNT;encrypt=true;trustServerCertificate=true
  #   username: ${DB_USER:sa}
  #   password: ${DB_PASSWORD}
  # jpa:
  #   hibernate:
  #     ddl-auto: validate
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

app:
  cors-origins: ${CORS_ORIGINS:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
